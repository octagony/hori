services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.10.26}
    container_name: hori-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
      - /var/www/node_modules
      - ./storage/downloads:/var/www/storage/downloads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hori

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.10.26}
    container_name: hori-queue
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./backend/.env
    command: npm run dev:worker
    volumes:
      - ./backend:/var/www
      - /var/www/node_modules
      - ./storage/downloads:/var/www/storage/downloads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hori

  nginx:
    image: nginx:1.27-alpine
    container_name: hori-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hori

  redis:
    image: redis:7-alpine
    container_name: hori-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hori

networks:
  hori:
    driver: bridge

volumes:
  redis-data: